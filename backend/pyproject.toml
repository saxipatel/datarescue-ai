[project]
name = "datarescue"
version = "0.1.0"
description = "Data reliability control plane: validation, incident diagnosis and approved, idempotent recovery."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.32,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=1.16",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13",
]
llm = [
    "anthropic>=1.0",
]
streaming = [
    "confluent-kafka>=2.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012",
    "E501",   # line length is enforced by `ruff format`; long string literals are allowed
]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make alembic look first-party.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/datagen/**" = ["S311"]  # synthetic data uses seeded random, not crypto

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL (and Redis for some tests)",
]
filterwarnings = ["ignore::DeprecationWarning:rq.*"]
