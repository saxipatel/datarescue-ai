name: datarescue
version: "0.1.0"
config-version: 2
profile: datarescue

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Mirrors the currency_allowlist rule default; change both together.
  allowed_currencies: ["USD", "EUR", "GBP"]

models:
  datarescue:
    staging:
      +materialized: view
    marts:
      +materialized: table
