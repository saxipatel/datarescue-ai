name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datarescue
          POSTGRES_PASSWORD: datarescue
          POSTGRES_DB: datarescue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datarescue" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://datarescue:datarescue@localhost:5432/datarescue_test
      REDIS_URL: redis://localhost:6379/0
      # Lets the Kafka adapter test import optional/ from the repository root.
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        working-directory: .
        run: ruff check backend scripts optional && ruff format --check backend scripts optional
      - name: mypy
        run: mypy app
      - name: Migrations (up, down, up)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: python -m pytest -q --cov=app --cov-report=term

  dbt:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datarescue
          POSTGRES_PASSWORD: datarescue
          POSTGRES_DB: datarescue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datarescue" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://datarescue:datarescue@localhost:5432/datarescue
      DATA_DIR: /tmp/datarescue-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt "dbt-core~=1.8.0" "dbt-postgres==1.8.2"
      - name: Migrate and seed
        working-directory: backend
        run: alembic upgrade head && python ../scripts/seed.py --batches 3
      - name: dbt build
        run: |
          mkdir -p /tmp/dbt-profiles && cp dbt/profiles.example.yml /tmp/dbt-profiles/profiles.yml
          dbt build --project-dir dbt --profiles-dir /tmp/dbt-profiles

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Scripted API demo
        run: docker compose run --rm --no-deps -T api python scripts/demo_scenario.py --api http://api:8000 --chaos
      - name: Playwright smoke tests
        run: |
          docker run --rm --network datarescue_frontend -e E2E_BASE_URL=http://frontend \
            -v "$PWD/frontend:/work" -w /work mcr.microsoft.com/playwright:v1.49.1-noble \
            sh -c "npm ci && npx playwright test"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 api worker migrate
